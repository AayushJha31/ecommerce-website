{% extends 'base/base.html' %}

{% block content %}
<main class="container mt-5 pt-3 mb-5">
	<div class="row justify-content-center">
		<div class="col-md-7 col-lg-5">
			<div class="card">
				<div class="card-body text-center py-5">
					<i class="fas fa-check-circle fa-3x text-success mb-3" aria-hidden="true"></i>
					<h1 class="h3">Payment successful</h1>
					<p class="text-muted">Your payment of ${{ payment.amount|floatformat:2 }} USD was verified.</p>
					<p class="small text-muted mb-4">Payment reference: {{ payment.payment_id }}</p>
					<a href="{% url 'index' %}" class="btn btn-primary">Continue shopping</a>
				</div>
			</div>
		</div>
	</div>
</main>
{% endblock %}
